# Alembic configuration for the CareerLens database.
#
# The app applies migrations itself at start-up (see src/ai_job_intelligence/
# migrate.py), so this file is only needed for the command-line tool, e.g.
#
#   cd ai-job-intelligence
#   .venv/bin/alembic revision --autogenerate -m "add a column"   # write a migration
#   .venv/bin/alembic upgrade head                                 # apply migrations
#   .venv/bin/alembic current                                      # where is this database?
#
# The database URL is never written here: env.py reads DATABASE_URL through
# config.py, exactly like the app.

[alembic]
script_location = %(here)s/src/ai_job_intelligence/migrations
prepend_sys_path = %(here)s/src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
