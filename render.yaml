# Render Blueprint for the CareerLens API (FastAPI).
#
# The frontend is deployed separately on Vercel. No secret values live in this
# file: SECRET_KEY is generated by Render, and the rest are prompted for when
# the Blueprint is applied (sync: false).
services:
  - type: web
    name: careerlens-api
    runtime: python
    rootDir: ai-job-intelligence
    buildCommand: pip install -r requirements.txt
    # The package lives under src/ (src layout), so point uvicorn there.
    startCommand: uvicorn ai_job_intelligence.main:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      # Refuses to start without a strong key in production; Render generates
      # a random 256-bit value here.
      - key: SECRET_KEY
        generateValue: true
      # postgresql://... connection string. SQLite is rejected in production.
      - key: DATABASE_URL
        sync: false
      # The Vercel origin(s), comma-separated, e.g. https://careerlens.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Optional: enables the Gemini-backed features.
      - key: GOOGLE_API_KEY
        sync: false
